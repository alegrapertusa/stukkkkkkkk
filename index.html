<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">
<title>Cards</title>
<meta name="apple-mobile-web-app-title" content="Cards">
<style>
:root{--bg:#1c1c1e;--chip:rgba(255,255,255,.14);--fg:#fff;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--vh:100vh;--bar:calc(60px + var(--sb));--m:max(calc(var(--st) + 16px),calc(var(--bar) + 8px));--cw:min(calc(100vw - 16px),calc((var(--vh) - 2*var(--m))/1.586))}
@supports (height:100dvh){:root{--vh:100dvh}}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;touch-action:manipulation}
.logo{position:fixed;left:0;top:0;z-index:0;pointer-events:none;will-change:transform;opacity:.32}
.logo img{display:block;width:100%;height:auto}
#track{position:fixed;left:0;right:0;top:0;height:var(--vh);z-index:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;perspective:1400px}
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.586);transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.1,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:calc(var(--cw)*.04);overflow:hidden;background:#fff;-webkit-backface-visibility:hidden;backface-visibility:hidden;container-type:size}
.face.back{transform:rotateY(180deg)}
.inner{position:absolute;inset:0}
.inner.rot{inset:auto;left:50%;top:50%;width:100cqh;height:100cqw;transform:translate(-50%,-50%) rotate(-90deg)}
.inner img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#555;border:2px dashed #bbb;border-radius:calc(var(--cw)*.03);margin:10px;inset:0;width:calc(100% - 20px);height:calc(100% - 20px)}
.ph b{font-size:18px;color:#222}
.ph button{font:inherit;font-size:15px;border:0;border-radius:999px;background:#111;color:#fff;padding:10px 20px}
.has .ph{display:none}
#bar{position:fixed;left:0;right:0;top:calc(var(--vh) - var(--bar));height:var(--bar);background:var(--bg);padding:0 14px env(safe-area-inset-bottom,0px);z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
#bar .l{justify-self:start}#bar .r{justify-self:end;display:flex;gap:6px}
.ib{background:none;border:0;color:#fff;width:42px;height:42px;display:grid;place-items:center;padding:0;opacity:.9}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dots{display:flex;gap:6px}
.dot{width:28px;height:28px;border-radius:50%;border:0;background:var(--chip);color:#fff;font:600 13px/1 inherit;font-family:inherit}
.dot.on{background:#fff;color:#000}
#toast{position:fixed;left:50%;bottom:calc(var(--bar) + 8px);transform:translateX(-50%);background:#222;color:#fff;font-size:13px;padding:10px 14px;border-radius:12px;z-index:5;opacity:0;pointer-events:none;transition:opacity .3s;max-width:88vw;text-align:center}
#toast.show{opacity:1}
input[type=file]{display:none}
</style>
</head>

<div class="logo" aria-hidden="true"><img alt="" src="" data-c="1"></div>
<div class="logo" aria-hidden="true"><img alt="" src="" data-c="1"></div>

<div id="track"></div>

<div id="bar">
  <div class="l"><button class="ib" id="fs" aria-label="Full screen"><svg id="fsi" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button></div>
  <div id="dots"></div>
  <div class="r">
    <button class="ib" id="qr" aria-label="QR code"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 17v4"/></svg></button>
    <button class="ib" id="flip" aria-label="Flip card"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/></svg></button>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*">

<script>
(function(){
  function setVh(){var h=innerHeight;if(innerHeight>innerWidth&&(navigator.standalone||matchMedia('(display-mode:standalone)').matches))h=Math.max(h,screen.height);document.documentElement.style.setProperty('--vh',h+'px')}
  setVh();addEventListener('resize',setVh);addEventListener('orientationchange',function(){setTimeout(setVh,300)});
  var N=2, track=document.getElementById('track'), dots=document.getElementById('dots');
  var file=document.getElementById('file'), toastEl=document.getElementById('toast');
  var cur=0, pickId=null, lpFired=false;

  function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.classList.remove('show')},3200)}
  function store(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
  function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

  function face(id,label,cls){
    return '<div class="face '+cls+'" data-id="'+id+'"><div class="inner"></div>'+
      '<div class="ph"><b>'+label+'</b><button type="button" data-up="'+id+'">Upload image</button></div></div>';
  }
  for(var i=0;i<N;i++){
    var s=document.createElement('section');s.className='slide';
    s.innerHTML='<div class="card" data-i="'+i+'">'+face(i+'f','Card '+(i+1)+' · front','front')+face(i+'b','Card '+(i+1)+' · back','back')+'</div>';
    track.appendChild(s);
    var d=document.createElement('button');d.className='dot'+(i?'':' on');d.textContent=i+1;d.dataset.i=i;dots.appendChild(d);
  }

  function setImg(id,url){
    var f=document.querySelector('.face[data-id="'+id+'"]');
    var inn=f.querySelector('.inner');inn.className='inner';inn.innerHTML='';if(url){var im=new Image();im.alt='';im.onload=function(){if(im.naturalWidth>im.naturalHeight)inn.classList.add('rot')};im.src=url;inn.appendChild(im)}
    f.classList.toggle('has',!!url);
  }
  ['0f','0b','1f','1b'].forEach(function(id){var u=load('card-'+id);if(u)setImg(id,u)});

  function pick(id){pickId=id;file.value='';file.click()}
  file.addEventListener('change',function(){
    var fl=file.files[0];if(!fl||!pickId)return;var id=pickId;
    var img=new Image(),url=URL.createObjectURL(fl);
    img.onload=function(){
      var m=1400,sc=Math.min(1,m/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var out=c.toDataURL('image/jpeg',.88);URL.revokeObjectURL(url);
      setImg(id,out);store('card-'+id,out);
    };
    img.src=url;
  });

  // tap = flip, long press on a filled face = replace image
  var lp;
  track.addEventListener('pointerdown',function(e){
    lpFired=false;var f=e.target.closest('.face.has');if(!f)return;
    lp=setTimeout(function(){lpFired=true;pick(f.dataset.id)},650);
  });
  ['pointerup','pointermove','pointercancel','scroll'].forEach(function(ev){track.addEventListener(ev,function(){clearTimeout(lp)},{passive:true})});
  track.addEventListener('click',function(e){
    var up=e.target.closest('[data-up]');
    if(up){e.stopPropagation();pick(up.dataset.up);return}
    if(lpFired){lpFired=false;return}
    var c=e.target.closest('.card');if(c)c.classList.toggle('flipped');
  });

  function go(i){track.scrollTo({left:i*track.clientWidth,behavior:'smooth'})}
  dots.addEventListener('click',function(e){var b=e.target.closest('.dot');if(b)go(+b.dataset.i)});
  track.addEventListener('scroll',function(){
    var i=Math.max(0,Math.min(N-1,Math.round(track.scrollLeft/track.clientWidth)));
    if(i!==cur){cur=i;[].forEach.call(dots.children,function(d,k){d.classList.toggle('on',k===i)})}
  },{passive:true});
  document.getElementById('flip').onclick=function(){document.querySelectorAll('.card')[cur].classList.toggle('flipped')};
  document.getElementById('qr').onclick=function(){toast('QR code isn’t active')};

  // full screen
  var fsBtn=document.getElementById('fs'),fsi=document.getElementById('fsi');
  var IN='M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5', OUT='M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5';
  var de=document.documentElement;
  var req=de.requestFullscreen||de.webkitRequestFullscreen;
  var isFs=function(){return document.fullscreenElement||document.webkitFullscreenElement};
  function icon(){fsi.firstElementChild.setAttribute('d',isFs()?OUT:IN)}
  document.addEventListener('fullscreenchange',icon);document.addEventListener('webkitfullscreenchange',icon);
  if(window.navigator.standalone||matchMedia('(display-mode:fullscreen), (display-mode:standalone)').matches){fsBtn.style.visibility='hidden'}
  fsBtn.onclick=function(){
    if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
    if(req){try{var p=req.call(de);if(p&&p.catch)p.catch(function(){toast('Full screen is blocked here. Open the page directly in your browser.')})}catch(e){}}
    else toast('iPhone Safari can’t do this. Tap Share → Add to Home Screen, then open it from there.');
  };

  // three slow DVD-style bouncing logos
  var W,H,last=0;
  var src=document.querySelector('.logo img').src;
  while(document.querySelectorAll('.logo').length<6){var c=document.querySelector('.logo').cloneNode(true);document.body.insertBefore(c,track)}
  var logos=[].slice.call(document.querySelectorAll('.logo'));
  logos.forEach(function(l){l.firstElementChild.src=src;});
  var cfg=[{sp:24,a:.8,x:.1,y:.1},{sp:20,a:2.3,x:.7,y:.2},{sp:26,a:4.1,x:.2,y:.45},{sp:22,a:5.4,x:.8,y:.55},{sp:25,a:1.5,x:.35,y:.8},{sp:21,a:3.5,x:.85,y:.92}];
  var B=logos.map(function(l,i){var c=cfg[i];return {l:l,sp:c.sp,vx:Math.cos(c.a),vy:Math.sin(c.a),fx:c.x,fy:c.y,x:null,y:null,w:0,h:0}});
  function size(){W=document.documentElement.clientWidth;H=Math.max(innerHeight,document.documentElement.clientHeight,parseFloat(document.documentElement.style.getPropertyValue('--vh'))||0);B.forEach(function(b){b.l.style.width=Math.round(W*.185)+'px';b.w=b.l.offsetWidth;b.h=b.l.offsetHeight;if(b.x===null){b.x=b.fx*(W-b.w);b.y=b.fy*(H-b.h)}b.x=Math.min(b.x,W-b.w);b.y=Math.min(b.y,H-b.h)})}
  size();addEventListener('resize',size);
  logos[0].firstElementChild.addEventListener('load',size);
  function tick(t){
    var dt=last?Math.min(.05,(t-last)/1000):0;last=t;
    B.forEach(function(b){
      b.x+=b.vx*b.sp*dt;b.y+=b.vy*b.sp*dt;
      if(b.x<=0){b.x=0;b.vx=Math.abs(b.vx)}else if(b.x>=W-b.w){b.x=W-b.w;b.vx=-Math.abs(b.vx)}
      if(b.y<=0){b.y=0;b.vy=Math.abs(b.vy)}else if(b.y>=H-b.h){b.y=H-b.h;b.vy=-Math.abs(b.vy)}
      b.l.style.transform='translate3d('+b.x+'px,'+b.y+'px,0)';
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
